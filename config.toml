baseURL = "https://blog.pazth.org/"
languageCode = "en-us"
title = "Pazthor Blog"
theme = "PaperMod"

[pagination]
  pagerSize = 10

publishDir = "public"
enableGitInfo = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[permalinks]
  posts = "/posts/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = "monokai"
  lineNos = true
  lineNumbersInTable = true

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  author = "pazthor"
  description = "Notes and updates from Pazthor."
  keywords = ["blog", "linux", "development", "devops", "tutorials"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.profileMode]
    enabled = false

  [params.homeInfoParams]
    Title = "Welcome to Pazthor's Blog"
    Content = "A developer's journey through Linux, system configuration, and technical experiments. I document troubleshooting adventures, setup guides, and lessons learned along the way."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/pazthor"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 3

[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 4
